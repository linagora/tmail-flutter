name: Security release scan

on:
  workflow_run:
    workflows: ["Build Docker images with Sentry"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to scan (e.g. v1.2.3)"
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/security-release.yaml"
      - ".github/security/**"

permissions: {}

concurrency:
  group: security-release-${{ github.event.workflow_run.head_branch || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    # release scans: image-sentry succeeded on a tag push of this repo; PRs: same-repo only
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.scope.outputs.sha }}
      ref: ${{ steps.scope.outputs.ref }}
      tag: ${{ steps.scope.outputs.tag }}
      base: ${{ steps.check.outputs.base }}
      areas: ${{ steps.check.outputs.areas }}
      report: ${{ steps.check.outputs.report }}
    steps:
      - name: Resolve scan scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
          PR_SHA: ${{ github.sha }}
          PR_REF: ${{ github.ref }}
        run: |
          # workflow_run runs in master's context: github.sha/ref are master, not the tag
          case "$EVENT" in
            pull_request)
              { echo "sha=$PR_SHA"; echo "ref=$PR_REF"; echo "tag="; } >> "$GITHUB_OUTPUT"
              exit 0 ;;
            workflow_run) tag=$RUN_TAG; sha=$RUN_SHA ;;
            *) tag=$INPUT_TAG; sha="" ;;
          esac
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.-]*$ ]]; then
            echo "::error::Not a release tag: $tag"
            exit 1
          fi
          if [[ -z "$sha" ]]; then
            sha=$(gh api "repos/$REPO/commits/refs/tags/$tag" --jq .sha) \
              || { echo "::error::Tag $tag does not exist."; exit 1; }
          fi
          { echo "sha=$sha"; echo "ref=refs/tags/$tag"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.scope.outputs.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Pick scan range and report sink
        id: check
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ steps.scope.outputs.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITLAB_TOKEN: ${{ secrets.SECURITY_GITLAB_TOKEN }}
          GITLAB_PROJECT: ${{ vars.SECURITY_GITLAB_PROJECT }}
          SMTP_URL: ${{ secrets.SECURITY_SMTP_URL }}
          SMTP_USER: ${{ secrets.SECURITY_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SECURITY_SMTP_PASSWORD }}
          MAIL_FROM: ${{ vars.SECURITY_MAIL_FROM }}
          REPORT_KEY: ${{ secrets.SECURITY_REPORT_KEY }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            base=$PR_BASE_SHA
          else
            # previous release tag; empty = first release, full history
            prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$SHA^" 2>/dev/null || true)
            base=$([[ -z "$prev" ]] || git rev-parse "$prev^{commit}")
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "areas=$(jq -c '["changes"] + map(.area)' .github/security/areas.json)" >> "$GITHUB_OUTPUT"
          if [[ -n "$GITLAB_TOKEN" && -n "$GITLAB_PROJECT" && -n "$SMTP_URL" && -n "$SMTP_USER" \
                && -n "$SMTP_PASSWORD" && -n "$MAIL_FROM" && -n "$REPORT_KEY" ]]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
          else
            echo "report=false" >> "$GITHUB_OUTPUT"
            echo "Private report skipped: SECURITY_GITLAB_*, SECURITY_SMTP_*, SECURITY_MAIL_FROM or SECURITY_REPORT_KEY not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

  gitleaks:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      found: ${{ steps.scan.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          url=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSfLO "$url/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfLO "$url/gitleaks_8.30.1_checksums.txt"
          grep " gitleaks_8.30.1_linux_x64.tar.gz$" gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks

      - name: Scan new commits
        id: scan
        env:
          BASE: ${{ needs.gate.outputs.base }}
        run: |
          range="HEAD"
          if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..HEAD"
          fi
          set +e
          "$RUNNER_TEMP/gitleaks" git --log-opts="$range" --redact --exit-code 2 \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif" .
          code=$?
          set -e
          [[ $code -eq 0 || $code -eq 2 ]] || exit $code
          echo "found=$([[ $code -eq 2 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          ref: ${{ needs.gate.outputs.ref }}
          sha: ${{ needs.gate.outputs.sha }}
          sarif_file: ${{ runner.temp }}/gitleaks.sarif
          category: gitleaks

  trivy:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      found: ${{ steps.vuln.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Scan dependencies
        id: vuln
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: ${{ runner.temp }}/trivy-vuln.sarif
          exit-code: "1"

      - name: Scan Dockerfile misconfigurations (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: ${{ runner.temp }}/trivy-misconfig.sarif
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          ref: ${{ needs.gate.outputs.ref }}
          sha: ${{ needs.gate.outputs.sha }}
          sarif_file: ${{ runner.temp }}/trivy-vuln.sarif
          category: trivy-vuln

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          ref: ${{ needs.gate.outputs.ref }}
          sha: ${{ needs.gate.outputs.sha }}
          sarif_file: ${{ runner.temp }}/trivy-misconfig.sarif
          category: trivy-misconfig

  osv:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Install osv-scanner
        working-directory: ${{ runner.temp }}
        run: |
          url=https://github.com/google/osv-scanner/releases/download/v2.6.0
          curl -sSfLO "$url/osv-scanner_linux_amd64"
          curl -sSfLO "$url/osv-scanner_SHA256SUMS"
          grep " osv-scanner_linux_amd64$" osv-scanner_SHA256SUMS | sha256sum -c -
          mv osv-scanner_linux_amd64 osv-scanner && chmod +x osv-scanner

      - name: Scan lockfiles
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source -r --format sarif --output "$RUNNER_TEMP/osv.sarif" .
          code=$?
          set -e
          # 0 = clean, 1 = vulns found (advisory); anything else = scanner error
          [[ $code -eq 0 || $code -eq 1 ]] || exit $code

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          ref: ${{ needs.gate.outputs.ref }}
          sha: ${{ needs.gate.outputs.sha }}
          sarif_file: ${{ runner.temp }}/osv.sarif
          category: osv-scanner

  semgrep:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Scan with semgrep
        run: |
          pip install --quiet semgrep==1.179.0
          semgrep scan --metrics=off \
            --config p/default --config p/secrets --config p/javascript \
            --config p/dockerfile --config p/github-actions \
            --sarif --output "$RUNNER_TEMP/semgrep.sarif" .

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          ref: ${{ needs.gate.outputs.ref }}
          sha: ${{ needs.gate.outputs.sha }}
          sarif_file: ${{ runner.temp }}/semgrep.sarif
          category: semgrep

  mobsfscan:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Scan Android and iOS sources
        run: |
          pip install --quiet mobsfscan==1.0.1
          # non-zero exit means findings; a missing SARIF file means the scanner broke
          mobsfscan --sarif -o "$RUNNER_TEMP/mobsfscan.sarif" android ios || true
          test -s "$RUNNER_TEMP/mobsfscan.sarif"

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          ref: ${{ needs.gate.outputs.ref }}
          sha: ${{ needs.gate.outputs.sha }}
          sarif_file: ${{ runner.temp }}/mobsfscan.sarif
          category: mobsfscan

  zizmor:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Audit GitHub workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  scorecard:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  llm-review:
    needs: [gate, gitleaks, trivy, osv, semgrep, mobsfscan]
    # no private sink, no LLM run: the report is never published publicly
    if: ${{ !cancelled() && needs.gate.outputs.report == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: read
    strategy:
      fail-fast: false
      # repo variable SECURITY_LLM_MAX_PARALLEL=1 runs the areas one by one
      max-parallel: ${{ fromJSON(vars.SECURITY_LLM_MAX_PARALLEL || '8') }}
      matrix:
        area: ${{ fromJSON(needs.gate.outputs.areas || '["changes"]') }}
    steps:
      - name: Check LLM config
        id: cfg
        env:
          LLM_API_KEY: ${{ secrets.SECURITY_LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.SECURITY_LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.SECURITY_LLM_MODEL }}
        run: |
          if [[ -z "$LLM_API_KEY" || -z "$LLM_BASE_URL" || -z "$LLM_MODEL" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "LLM review skipped: SECURITY_LLM_* not configured." >> "$GITHUB_STEP_SUMMARY"
          else
            # the key goes in an Authorization header; refuse cleartext endpoints
            if [[ "$LLM_BASE_URL" != https://* ]]; then
              echo "::error::SECURITY_LLM_BASE_URL must use https."
              exit 1
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cfg.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare review input
        if: steps.cfg.outputs.enabled == 'true'
        env:
          BASE: ${{ needs.gate.outputs.base }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ needs.gate.outputs.ref }}
          AREA: ${{ matrix.area }}
        run: |
          findings=""
          if [[ "$AREA" == "changes" ]]; then
            # open code-scanning alerts for this ref, error/warning only
            # no analysis for the ref yet answers 404: review without findings
            { gh api --paginate "repos/$REPO/code-scanning/alerts?ref=$REF&state=open&per_page=100" \
              --jq '.[] | select(.rule.severity == "error" or .rule.severity == "warning") | {tool: .tool.name, rule: .rule.id, level: .rule.severity, text: .most_recent_instance.message.text, at: "\(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"}' || true; } \
              | jq -s . > "$RUNNER_TEMP/findings.json"
            findings="$RUNNER_TEMP/findings.json"
          fi
          BASE="$BASE" FINDINGS="$findings" bash .github/security/prepare-review.sh "$AREA"

      - if: steps.cfg.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install opencode
        if: steps.cfg.outputs.enabled == 'true'
        run: npm ci --silent --prefix .github/security/opencode

      - name: Run opencode security review
        if: steps.cfg.outputs.enabled == 'true'
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.SECURITY_LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.SECURITY_LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.SECURITY_LLM_MODEL }}
          AREA: ${{ matrix.area }}
          # ignore repo .opencode config/plugins in the key-bearing step
          OPENCODE_DISABLE_PROJECT_CONFIG: "true"
        run: |
          export OPENCODE_CONFIG="$RUNNER_TEMP/opencode.json"
          jq -n --arg model "$LLM_MODEL" '{
            "$schema": "https://opencode.ai/config.json",
            autoupdate: false,
            share: "disabled",
            provider: { "security-llm": {
              npm: "@ai-sdk/openai-compatible",
              name: "Security LLM",
              options: { baseURL: "{env:LLM_BASE_URL}", apiKey: "{env:LLM_API_KEY}" },
              models: { ($model): { name: $model } }
            } },
            model: ("security-llm/" + $model),
            permission: { edit: "deny", bash: "deny", webfetch: "deny", external_directory: "deny" }
          }' > "$OPENCODE_CONFIG"
          # report goes to the private email only: run logs are public
          timeout 40m .github/security/opencode/node_modules/.bin/opencode run "$(cat ".security-review/prompt-$AREA.md")" \
            > .security-review/llm-report.md

      - name: Encrypt report
        if: always() && steps.cfg.outputs.enabled == 'true'
        env:
          REPORT_KEY: ${{ secrets.SECURITY_REPORT_KEY }}
          AREA: ${{ matrix.area }}
        run: |
          mkdir -p .security-review
          # artifacts of a public repo are downloadable: ship only ciphertext
          report=.security-review/llm-report.md
          [[ -s "$report" ]] || echo "LLM review produced no output; see the run log." > "$report"
          { echo "## LLM review: $AREA"; echo; cat "$report"; } \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:REPORT_KEY -out "$RUNNER_TEMP/llm-$AREA.enc"

      - if: always() && steps.cfg.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-report-${{ matrix.area }}
          path: ${{ runner.temp }}/llm-${{ matrix.area }}.enc
          retention-days: 1
          if-no-files-found: error

  report:
    needs: [gate, gitleaks, trivy, osv, semgrep, mobsfscan, zizmor, scorecard, llm-review]
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
          sparse-checkout: .github/security

      - name: Count open alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ needs.gate.outputs.ref }}
        run: |
          { gh api --paginate "repos/$REPO/code-scanning/alerts?ref=$REF&state=open&per_page=100" --jq '.[].tool.name' || true; } \
            | jq -Rrs 'split("\n") | map(select(. != "")) | group_by(.) | .[] | "| \(.[0]) | \(length) |"' \
            > "$RUNNER_TEMP/counts.md"

      - name: Write summary
        env:
          RESULTS: ${{ toJSON(needs) }}
          TAG: ${{ needs.gate.outputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          {
            echo "## Security scan — ${TAG:-PR} \`${SHA::9}\`"
            echo "| Job | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | select(.key != "gate") | "| \(.key) | \(.value.result) |"' <<< "$RESULTS"
            echo
            echo "| Tool | Open alerts |"
            echo "|---|---|"
            cat "$RUNNER_TEMP/counts.md"
            echo
            echo "Details: Security tab → Code scanning, and the emailed report."
          } > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Download LLM reports
        if: needs.gate.outputs.report == 'true'
        continue-on-error: true # none exist when SECURITY_LLM_* is unset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: llm-report-*
          path: ${{ runner.temp }}/llm
          merge-multiple: true

      - name: Email report to GitLab owners/maintainers
        if: needs.gate.outputs.report == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.SECURITY_GITLAB_TOKEN }}
          GITLAB_PROJECT: ${{ vars.SECURITY_GITLAB_PROJECT }}
          SMTP_URL: ${{ secrets.SECURITY_SMTP_URL }}
          SMTP_USER: ${{ secrets.SECURITY_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SECURITY_SMTP_PASSWORD }}
          MAIL_FROM: ${{ vars.SECURITY_MAIL_FROM }}
          REPORT_KEY: ${{ secrets.SECURITY_REPORT_KEY }}
          TAG: ${{ needs.gate.outputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
          BASE: ${{ needs.gate.outputs.base }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/report.md"
          shopt -s nullglob
          {
            printf 'Run: %s\nRange: %s..%s\n\n' "$RUN_URL" "${BASE:-full}" "$SHA"
            cat "$RUNNER_TEMP/summary.md"
            compgen -G "$RUNNER_TEMP/llm/*.enc" > /dev/null || printf '\n(no LLM area reports were produced; see the run log)\n'
            for f in "$RUNNER_TEMP"/llm/*.enc; do
              echo
              openssl enc -d -aes-256-cbc -pbkdf2 -pass env:REPORT_KEY -in "$f" \
                || echo "(could not decrypt $(basename "$f"))"
            done
          } > "$body"
          subject="Security scan ${TAG:-${SHA::9}} $(date -u +%F)"
          [[ "$EVENT" != "pull_request" ]] || subject="[PR #$PR_NUMBER] $subject"
          MAIL_SUBJECT="$subject" bash .github/security/send-report.sh "$body"

      - name: Fail on new secrets or high/critical vulnerabilities
        if: needs.gitleaks.outputs.found == 'true' || needs.trivy.outputs.found == 'true'
        env:
          GITLEAKS_FOUND: ${{ needs.gitleaks.outputs.found }}
          TRIVY_FOUND: ${{ needs.trivy.outputs.found }}
        run: |
          echo "::error::gitleaks found=$GITLEAKS_FOUND, trivy found=$TRIVY_FOUND. See Security tab."
          exit 1
