on:
  workflow_run:
    workflows:
      - "Analyze and test"
    types:
      - completed

name: Test Reports

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  reports:
    name: Upload test reports
    runs-on: ubuntu-latest
    steps:
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          artifact: /test-reports-(.*)/
          name: Flutter Tests - $1
          path: "*.json"
          reporter: flutter-json
          only-summary: "true"
