name: Web integration tests

on:
  pull_request:
    paths-ignore:
      - ".github/**"
      - "docs"
      - "Jenkinsfile"
      - "**/*.md"

permissions:
  contents: read

jobs:
  web_integration_test:
    # the reusable job requests id-token
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-web-integration-test.yaml
