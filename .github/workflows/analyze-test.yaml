on:
  pull_request:
    paths-ignore:
      - ".github/**"
      - "docs"
      - "Jenkinsfile"
      - "**/*.md"

name: Analyze and test

env:
  FLUTTER_VERSION: 3.38.9
  # Test paths to run on the Chrome platform, one per line, relative to repo
  # root. Each path's leading segment must be its package directory (e.g.
  # "core"). Add more lines here as needed.
  CHROME_TEST_PATHS: |
    core/test/data/network/download/download_manager_test.dart
    workplace/test/data/datasource/drive_transfer/drive_transfer_strategy_factory_web_test.dart
    workplace/test/data/datasource/drive_transfer/opfs_drive_file_stager_test.dart
    workplace/test/data/datasource/drive_transfer/opfs_drive_file_uploader_test.dart
    workplace/test/data/datasource/drive_transfer/opfs_fetch_download_test.dart
    workplace/test/data/datasource/drive_transfer/opfs_xhr_upload_test.dart

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modules:
          - default
          - core
          - model
          - contact
          - forward
          - rule_filter
          - fcm
          - email_recovery
          - server_settings
          - workplace
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
          cache-key: "deps-${{ hashFiles('pubspec.lock') }}"
          cache-path: ${{ runner.tool_cache }}/flutter # optional, change this to specify the cache path

      - name: Setup Firebase env
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
        run: ./scripts/setup-firebase.sh

      - name: Run prebuild
        run: ./scripts/prebuild.sh

      - name: Analyze
        uses: zgosalvez/github-actions-analyze-dart@v1

      - name: Test
        env:
          MODULES: ${{ matrix.modules }}
        run: ./scripts/test.sh

      - name: Test (Chrome)
        if: matrix.modules == 'default'
        run: |
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            package_dir="${path%%/*}"
            rel_path="${path#*/}"
            (cd "$package_dir" && flutter test "$rel_path" --platform chrome)
          done <<< "$CHROME_TEST_PATHS"

      - name: Upload test reports
        if: success() || failure() # Always upload report
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.modules }}
          path: test-report*.json
