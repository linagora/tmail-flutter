on:
  pull_request:
    paths-ignore:
      - ".github/**"
      - "docs"
      - "Jenkinsfile"
      - "**/*.md"

name: Analyze and test

env:
  FLUTTER_VERSION: 3.38.9

jobs:
  discover-tests:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Discover packages with tests
        id: modules
        run: |
          modules=$(python3 scripts/test-platforms.py matrix)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  analyze-test:
    needs: discover-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.discover-tests.outputs.modules) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
          cache-key: "deps-${{ hashFiles('pubspec.lock') }}"
          cache-path: ${{ runner.tool_cache }}/flutter # optional, change this to specify the cache path

      - name: Setup Firebase env
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
        run: ./scripts/setup-firebase.sh

      - name: Run prebuild
        id: prebuild
        run: ./scripts/prebuild.sh

      - name: Analyze
        uses: zgosalvez/github-actions-analyze-dart@v1

      - name: Test
        if: ${{ !cancelled() && steps.prebuild.outcome == 'success' }}
        env:
          MODULES: ${{ matrix.modules.path }}
        run: ./scripts/test.sh

      - name: Upload test reports
        if: success() || failure() # Always upload report
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.modules.id }}
          path: test-report*.json
