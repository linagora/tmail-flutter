name: Memory leak check

# Profile-mode memory check of three heavy-image flows on web and Android.
# Called by:
#   - image-sentry.yaml (on tag push, in parallel with the security scan)
#   - memory-leak-check-label.yaml (any PR labelled `memory-check`)
# It also runs on PRs that touch the check itself, so the check is proven before merge.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/memory-leak-check*.yaml"
      - "scripts/memory-leak-check.sh"
      - "scripts/memory-leak-android-run.sh"
      - "scripts/memory-leak-report.py"
      - "scripts/memory_report/**"
      - "scripts/test_memory_leak_report.py"
      - "scripts/ci-memory-sidecar.js"
      - "integration_test/memory/**"
      - "integration_test/scenarios/memory/**"
      - "integration_test/tests/memory/**"
      - "integration_test/robots/abstract_common_robot.dart"
      - "integration_test/robots/email_robot.dart"
      - "integration_test/robots/identity_creator_robot.dart"
      - "integration_test/robots/profiles_robot.dart"
      - "integration_test/utils/send_and_wait_for_completion.dart"
      - "integration_test/utils/test_timeouts.dart"
      - "integration_test/utils/wait_for_condition.dart"
      - "android/app/build.gradle"

concurrency:
  group: memory-leak-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.38.9

permissions:
  contents: read

jobs:
  web:
    name: Memory leak check (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Run prebuild
        run: ./scripts/prebuild.sh

      - name: Test the report script
        run: python3 -I -m unittest discover -s scripts -p 'test_memory_leak_report.py'

      - name: Memory check
        run: bash scripts/memory-leak-check.sh web

      - name: Compress heap snapshots
        if: always()
        run: gzip -f ci-logs/memory/*.heapsnapshot || true

      - name: Upload heap snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-heapsnapshots-web
          path: ci-logs/memory/*.heapsnapshot.gz
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-logs-web
          path: |
            ci-logs/
            !ci-logs/memory/*.heapsnapshot.gz
          retention-days: 30
          if-no-files-found: ignore

  android:
    name: Memory leak check (android)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Run prebuild
        run: ./scripts/prebuild.sh

      - name: Memory check
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          disable-animations: true
          emulator-boot-timeout: 1000
          script: bash scripts/memory-leak-check.sh android

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-logs-android
          path: ci-logs/
          retention-days: 30
          if-no-files-found: ignore
