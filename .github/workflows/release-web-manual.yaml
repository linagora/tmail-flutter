name: Release web (manual, no tests)

# Manual-only: builds and pushes the web release image for an existing tag.
# Skips the web E2E gate and does not move the floating `release` Docker tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build (e.g. v1.2.3 or v1.2.3-rc1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      # Queried through the API so the check costs no clone.
      - name: Check tag format and existence
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Tag '$TAG' must look like vX.Y.Z (optionally with a suffix)."
            exit 1
          fi
          if ! gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist in ${{ github.repository }}."
            exit 1
          fi

  build-web-image:
    name: Build release image with Sentry
    needs: validate-tag
    runs-on: ubuntu-latest
    environment: prod
    # Two runs pushing the same image tag would race; last writer would win.
    concurrency:
      group: web-release-image-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          # The repo has no .dockerignore, so `COPY . .` would sweep .git/config -
          # and the checkout token it holds - into the build layer and the cache.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # github.sha is the dispatching ref's head, not necessarily the checked-out tag's commit.
      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Docker tags cannot contain "/", so a ref like `feature/x` becomes `feature-x`.
      - name: Sanitize image tag
        id: image_tag
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          SAFE_TAG=$(printf '%s' "$RAW_TAG" | tr -c 'A-Za-z0-9_.-' '-')
          echo "value=${SAFE_TAG:0:128}" >> "$GITHUB_OUTPUT"

      - name: Extract app version from pubspec.yaml
        id: app_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ github.repository_owner }}/tmail-web
            ghcr.io/${{ github.repository_owner }}/tmail-web
          tags: |
            type=raw,value=${{ steps.image_tag.outputs.value }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (release)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: |
            type=gha
          cache-to: |
            type=gha
          build-args: |
            FLUTTER_VERSION=3.38.9
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
            SENTRY_URL=${{ secrets.SENTRY_URL }}
            SENTRY_RELEASE=${{ steps.app_version.outputs.version }}
            GITHUB_SHA=${{ steps.commit.outputs.sha }}
            VCS_REF=${{ github.repository }}@${{ steps.commit.outputs.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract sourcemaps from Docker image
        if: always()
        run: |
          # Get the first image tag (for amd64 platform)
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)

          if [ -z "$IMAGE_TAG" ]; then
            echo "No image tag found, skipping sourcemap extraction"
            exit 0
          fi

          echo "Extracting sourcemaps from image: $IMAGE_TAG"

          # Create temporary container to extract files
          CONTAINER_ID=$(docker create --platform linux/amd64 "$IMAGE_TAG" 2>/dev/null | head -n1)

          if [ -n "$CONTAINER_ID" ]; then
            echo "Created container: $CONTAINER_ID"

            # Create directory for sourcemaps
            mkdir -p sourcemaps

            # Copy all files from container
            docker cp "$CONTAINER_ID:/usr/share/nginx/html/." sourcemaps/ 2>/dev/null || true

            # Remove container
            docker rm "$CONTAINER_ID" 2>/dev/null || true

            # Filter only .map files and keep directory structure
            find sourcemaps -type f ! -name "*.map" -delete 2>/dev/null || true

            echo "Sourcemaps extracted:"
            find sourcemaps -name "*.map" | head -10 || echo "No .map files found"
            MAP_COUNT=$(find sourcemaps -name "*.map" 2>/dev/null | wc -l)
            echo "Total .map files: $MAP_COUNT"
          else
            echo "Warning: Could not create container from image"
          fi

      - name: Upload sourcemaps as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-${{ steps.app_version.outputs.version }}
          path: sourcemaps/**/*.map
          retention-days: 30
          if-no-files-found: warn
